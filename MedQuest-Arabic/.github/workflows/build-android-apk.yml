name: Build Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - working-directory: MedQuest-Arabic
        run: pnpm install --no-frozen-lockfile
      - working-directory: MedQuest-Arabic/artifacts/medquest-arabic
        env:
          VITE_ANDROID_API_URL: https://medquest-arabic.onrender.com
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: echo "VITE_ANDROID_API_URL=$VITE_ANDROID_API_URL" > .env && [ -n "$VITE_CLERK_PUBLISHABLE_KEY" ] && echo "VITE_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY" >> .env || true
      - working-directory: MedQuest-Arabic
        run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/medquest-arabic build
      - working-directory: MedQuest-Arabic/artifacts/medquest-arabic
        run: npx cap sync android
      - working-directory: MedQuest-Arabic/artifacts/medquest-arabic/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: medquest-debug-apk
          path: MedQuest-Arabic/artifacts/medquest-arabic/android/app/build/outputs/apk/debug/app-debug.apk

