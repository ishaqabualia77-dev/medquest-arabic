name: Build MedQuest Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: MedQuest-Arabic/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        working-directory: MedQuest-Arabic
        run: pnpm install --frozen-lockfile

      - name: Check Clerk key
        working-directory: MedQuest-Arabic/artifacts/medquest-arabic
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "Clerk key is present"
          else
            echo "Clerk key is MISSING"
            exit 1
          fi

      - name: Build web app
        working-directory: MedQuest-Arabic/artifacts/medquest-arabic
        env:
          PORT: 5000
          BASE_PATH: /
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: Sync Capacitor
        working-directory: MedQuest-Arabic
        run: pnpm --filter @workspace/medquest-arabic exec cap sync android

      - name: Build APK
        working-directory: MedQuest-Arabic/artifacts/medquest-arabic/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedQuest-Arabic-APK
          path: MedQuest-Arabic/artifacts/medquest-arabic/android/app/build/outputs/apk/debug/app-debug.apk
