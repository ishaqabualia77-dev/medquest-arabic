name: Build MedQuest Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: MedQuest-Arabic/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: MedQuest-Arabic
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: MedQuest-Arabic/artifacts/medquest-arabic
        env:
          PORT: 5000
          BASE_PATH: /
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: Sync Capacitor
        working-directory: MedQuest-Arabic
        run: pnpm --filter @workspace/medquest-arabic exec cap sync android

      - name: Build APK
        working-directory: MedQuest-Arabic/artifacts/medquest-arabic/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MedQuest-Arabic-APK
          path: MedQuest-Arabic/artifacts/medquest-arabic/android/app/build/outputs/apk/debug/app-debug.apk
